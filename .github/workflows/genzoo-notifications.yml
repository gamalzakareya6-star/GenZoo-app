name: GenZoo Automatic Notifications

on:
  # Fast path: an external cron service (e.g. cron-job.org) calls the
  # workflow_dispatch API every minute. See README for the setup.
  workflow_dispatch:
  # Fallback only. GitHub often delays scheduled runs by hours, so do not
  # rely on it alone.
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: read

concurrency:
  group: genzoo-automatic-notifications
  cancel-in-progress: false

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Firebase Admin SDK
        run: pip install -r scripts/requirements.txt

      - name: Send notifications for new posts
        env:
          GENZOO_FCM_SERVICE_ACCOUNT: ${{ secrets.GENZOO_FCM_SERVICE_ACCOUNT }}
        run: python scripts/send_notifications.py
