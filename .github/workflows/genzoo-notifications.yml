name: GenZoo Automatic Notifications

on:
  # Fast path: an external cron service (e.g. cron-job.org) calls the
  # workflow_dispatch API every minute. See README for the setup.
  workflow_dispatch:
  # Fallback only. GitHub often delays scheduled runs by hours, so do not
  # rely on it alone.
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: read

concurrency:
  group: genzoo-automatic-notifications
  cancel-in-progress: false

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Firebase Admin SDK
        run: pip install -r scripts/requirements.txt

      - name: Import Telegram group messages as posts
        # A Telegram problem must never block the notifications below.
        continue-on-error: true
        env:
          GENZOO_FCM_SERVICE_ACCOUNT: ${{ secrets.GENZOO_FCM_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_ONLY_ADMINS: ${{ secrets.TELEGRAM_ONLY_ADMINS }}
        run: python scripts/telegram_sync.py

      - name: Import private Telegram groups (own account)
        continue-on-error: true
        env:
          GENZOO_FCM_SERVICE_ACCOUNT: ${{ secrets.GENZOO_FCM_SERVICE_ACCOUNT }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TELETHON_SESSION: ${{ secrets.TELETHON_SESSION }}
          TELETHON_CHAT_IDS: ${{ secrets.TELETHON_CHAT_IDS }}
        run: python scripts/telegram_user_sync.py

      - name: Send notifications for new posts
        env:
          GENZOO_FCM_SERVICE_ACCOUNT: ${{ secrets.GENZOO_FCM_SERVICE_ACCOUNT }}
        run: python scripts/send_notifications.py
