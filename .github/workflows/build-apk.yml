
name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a GitHub Release (in-app updates)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Install Dependencies
        shell: bash
        run: |
          # On failure, publish the error as an annotation so it can be read
          # without opening the raw logs.
          if ! flutter pub get > pub_out.txt 2>&1; then
            cat pub_out.txt
            MSG=$(head -c 1500 pub_out.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=pub get failed::$MSG"
            exit 1
          fi
          cat pub_out.txt

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are missing. Using a temporary debug key: this APK cannot be installed over a previously installed build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      # The build number (Android versionCode) grows with every run, so each
      # new APK installs as an update over the previous one.
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build apk --release --build-number=${{ github.run_number }} > build_out.txt 2>&1; then
            tail -n 60 build_out.txt
            ERRS=$(grep -E "Error:|error:|^e: |What went wrong|Could not|FAILURE|Execution failed|not found|isn't defined|doesn't" -A2 build_out.txt | head -c 2500 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build failed::$ERRS"
            exit 1
          fi
          tail -n 5 build_out.txt

      - name: Show APK signing certificate
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo "========== APK SIGNING CERTIFICATE =========="
          "$APKSIGNER" verify --print-certs "$APK"

          echo "========== KEYTOOL CERTIFICATE =========="
          keytool -printcert -jarfile "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      # Every successful build on main becomes a release "build-<number>".
      # The app checks the latest release and offers to install it.
      - name: Publish release for in-app update
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk GenZoo.apk
          NOTES="$(git log -1 --pretty=%s)"
          gh release create "build-${{ github.run_number }}" GenZoo.apk \
            --title "GenZoo build ${{ github.run_number }}" \
            --notes "$NOTES" --latest
